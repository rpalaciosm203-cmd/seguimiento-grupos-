<style>
  :root {
    --bg: #f4f7f6;
    --surface: #ffffff;
    --surface-2: #eef3f1;
    --surface-3: #e5eeeb;
    --text: #18312b;
    --text-dim: #6d7c77;
    --border: #dce7e3;
    --accent: #2f6f62;
    --accent-2: #4e9181;
    --accent-soft: #e3f1ed;
    --ok: #2f7a55;
    --ok-bg: #e6f4eb;
    --warn: #a96a2b;
    --warn-bg: #fff0df;
    --danger: #b94b45;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #f8fbfa 0%, var(--bg) 48%, #f1f5f3 100%);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .card {
    background: rgba(255,255,255,.96);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(29, 64, 55, .06);
  }
  .pill { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .pill-proceso { background: var(--warn-bg); color: var(--warn); }
  .pill-superada { background: var(--ok-bg); color: var(--ok); }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-radius: 12px; padding: 10px 15px; font-weight: 700; font-size: 14px;
    border: none; cursor: pointer; box-shadow: 0 5px 14px rgba(47,111,98,.18); transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .btn:hover { box-shadow: 0 7px 18px rgba(47,111,98,.24); }
  .btn:active { transform: translateY(1px) scale(.99); opacity: .9; }
  .btn-ghost {
    background: var(--surface); color: var(--accent); border: 1px solid var(--border); border-radius: 11px;
    padding: 9px 13px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background .15s, transform .15s;
  }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn-danger { background: #fff7f6; color: var(--danger); border: 1px solid #e8c4c1; border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  input, select, textarea {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 11px; font-size: 14px; width: 100%; outline: none; transition: border .15s, box-shadow .15s, background .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(78,145,129,.13); }
  textarea { resize: vertical; }
  label { color: var(--text); }
  .tab-btn { padding: 10px 6px; font-weight: 700; font-size: 14px; color: var(--text-dim); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .app-header { position: sticky; top: 0; z-index: 40; background: rgba(248,251,250,.94); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(220,231,227,.9); }
  .brand-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand-mark { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-size:21px; box-shadow:0 7px 18px rgba(47,111,98,.2); flex:0 0 auto; }
  .brand-title { font-size:17px; font-weight:800; letter-spacing:-.2px; }
  .brand-subtitle { margin-top:2px; font-size:12px; color:var(--text-dim); }
  .group-select-wrap { margin-top:12px; display:flex; align-items:center; gap:8px; }
  .group-select-wrap select { flex:1; min-width:0; font-weight:700; background:var(--surface); }
  .group-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .bottom-nav { position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(720px,100%); z-index:50; padding:8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background:rgba(255,255,255,.97); border-top:1px solid var(--border); box-shadow:0 -8px 28px rgba(29,64,55,.08); display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .nav-item { border:0; background:transparent; color:var(--text-dim); border-radius:13px; padding:7px 3px; font-size:10px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .nav-item .nav-icon { font-size:19px; line-height:1; }
  .nav-item.active { color:var(--accent); background:var(--accent-soft); }
  .nav-item:active { transform:scale(.97); }
  .more-sheet { position:fixed; inset:0; z-index:70; background:rgba(18,39,34,.28); backdrop-filter:blur(3px); display:flex; align-items:flex-end; }
  .more-panel { width:min(720px,100%); margin:0 auto; background:var(--surface); border-radius:24px 24px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); box-shadow:0 -14px 40px rgba(20,45,39,.18); animation:sheetIn .2s ease-out; }
  .more-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
  .more-item { background:var(--surface-2); border:1px solid var(--border); border-radius:15px; padding:14px; text-align:left; font-weight:700; color:var(--text); cursor:pointer; }
  .more-item span { display:block; font-size:22px; margin-bottom:7px; }
  .hero { border-radius:22px; padding:20px; background:linear-gradient(135deg,#245f54,#4e9181); color:#fff; box-shadow:0 12px 28px rgba(47,111,98,.2); }
  .hero .muted { color:rgba(255,255,255,.78); }
  .section-title { font-size:15px; font-weight:800; margin:20px 2px 10px; }
  .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat-card { padding:14px; min-height:100px; }
  .stat-icon { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); font-size:18px; margin-bottom:9px; }
  .stat-value { font-size:24px; font-weight:850; letter-spacing:-.5px; }
  .stat-label { font-size:12px; color:var(--text-dim); margin-top:2px; }
  .quick-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .quick-card { padding:14px; cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .quick-card:active { transform:scale(.985); }
  .quick-card .qicon { font-size:24px; }
  .quick-card strong { display:block; margin-top:7px; }
  .quick-card small { color:var(--text-dim); display:block; margin-top:3px; }
  .empty-state { text-align:center; padding:28px 16px; color:var(--text-dim); }
  .status-bar { position:fixed; left:50%; bottom:66px; transform:translateX(-50%); z-index:45; width:min(680px,calc(100% - 24px)); padding:0; pointer-events:none; }
  .status-bar:not(:empty) { padding:9px 13px; background:#18312b; color:#fff; border-radius:12px; text-align:center; box-shadow:0 8px 22px rgba(24,49,43,.18); font-size:12px; }
  .animate-in { animation:fadeUp .25s ease-out both; }
  .card, .hero, .quick-card, .stat-card { animation:fadeUp .22s ease-out both; }
  ::-webkit-scrollbar { height:6px; width:6px; }
  .wrap-x { overflow-x:auto; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  @keyframes sheetIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
  @media (max-width:520px){
    #content { padding:14px 12px 105px !important; }
    .brand-title { font-size:16px; }
    .hero { padding:17px; }
    .more-grid { grid-template-columns:1fr 1fr; }
  }
</style>
<style id="ministerio-theme">
  /* Identidad visual inspirada en el logo: azul marino, rojo, amarillo y blanco */
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --surface-3: #e5eaf3;
    --text: #17233d;
    --text-dim: #657086;
    --border: #d9e0eb;
    --accent: #0a2a63;
    --accent-2: #174b9b;
    --accent-soft: #eaf0fb;
    --ok: #23784c;
    --ok-bg: #e7f5ed;
    --warn: #a86d00;
    --warn-bg: #fff5d6;
    --danger: #d2262e;
  }
  body { background: linear-gradient(180deg, #f8faff 0%, var(--bg) 48%, #eef2f8 100%); }
  .card { box-shadow: 0 8px 24px rgba(10,42,99,.07); }
  .btn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 5px 14px rgba(10,42,99,.20); }
  .btn:hover { box-shadow: 0 7px 18px rgba(10,42,99,.27); }
  .btn-ghost { color: var(--accent); }
  .btn-danger { background: #fff5f5; color: var(--danger); border-color: #efc7ca; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(23,75,155,.13); }

  .app-header { background: rgba(248,250,255,.95); border-bottom: 3px solid var(--danger); box-shadow: 0 3px 12px rgba(210,38,46,.08); }
  .brand-mark { background: linear-gradient(145deg, #d2262e 0%, #ef3038 48%, #0a2a63 49%, #174b9b 100%); box-shadow: 0 7px 18px rgba(210,38,46,.28); }
  .bottom-nav { box-shadow: 0 -8px 28px rgba(10,42,99,.10); border-top: 2px solid rgba(210,38,46,.24); }

  .hero { border-bottom: 5px solid var(--danger); }
  .quick-card[data-quick="reuniones"] { border-top: 4px solid var(--danger); }
  .quick-card[data-quick="reuniones"] .qicon { color: var(--danger); }
  .quick-card[data-quick="asistencia"] { border-top: 4px solid #ffd21a; }
  .more-sheet { background: rgba(7,25,55,.30); }
  .more-panel { box-shadow: 0 -14px 40px rgba(7,25,55,.22); }
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #061d4a 0%, #0a2a63 58%, #174b9b 100%); box-shadow: 0 12px 28px rgba(10,42,99,.22); }
  .hero::after { content:""; position:absolute; width:110px; height:110px; right:-32px; top:-38px; border-radius:50%; background:rgba(255,210,26,.16); box-shadow:-52px 72px 0 -20px rgba(210,38,46,.18); pointer-events:none; }
  .hero > * { position:relative; z-index:1; }
  .stat-card:nth-child(2) .stat-icon { background:#fff3f3; }
  .stat-card:nth-child(3) .stat-icon { background:#fff8df; }
  .stat-card:nth-child(4) .stat-icon { background:#eaf0fb; }
  .status-bar:not(:empty) { background:#0a2a63; box-shadow:0 8px 22px rgba(10,42,99,.22); }
  .quick-card:active, .nav-item:active, .btn:active { transform:scale(.985); }

<body>
<div id="app" style="max-width: 720px; margin: 0 auto; min-height: 100%; display:flex; flex-direction:column;">
  <header class="app-header">
    <div style="padding:12px 14px 11px;">
      <div class="brand-row">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <div class="brand-mark">🙏</div>
          <div style="min-width:0;">
            <div class="brand-title">Seguimiento de Grupos</div>
            <div class="brand-subtitle">Organización · Comunidad · Seguimiento</div>
          </div>
        </div>
      </div>
      <div id="groupBar"></div>
    </div>
  </header>
  <div id="content" style="padding:16px 14px 105px; flex:1;"></div>
  <div id="statusBar" class="status-bar"></div>
  <nav id="bottomNav" class="bottom-nav" aria-label="Navegación principal"></nav>
  <div id="moreSheet" style="display:none;"></div>

<script>
(function(){
  "use strict";

  // ---------- state ----------
  let db = null, downloadsCap = null, canUse = false;
  let authUser = null;
  let appRole = "coordinator";
  let appProfile = null;
  let institutionalSession = false;
  let secondaryAuth = null;
  let groups = [];
  let currentGroupId = null;
  let people = []; // [{id, name, active}]
  let situationsCache = {}; // personId -> [situations]
  let attendanceHistory = []; // recent attendance docs
  let guestList = []; // invitados del grupo, separados de los miembros oficiales
  let meetingGuestRows = []; // invitados editados en el formulario de reunión
  let activeTab = "inicio";
  let unsubGroups = null, unsubPeople = null;

  function safeLocalGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function safeLocalSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  function setStatus(msg){
    document.getElementById("statusBar").textContent = msg || "";
  }

  function todayISO(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function sha256Hex(text){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  let unlockedGroups = new Set();
  try { unlockedGroups = new Set(JSON.parse(safeLocalGet("unlockedGroups") || "[]")); } catch(e){ unlockedGroups = new Set(); }
  function markUnlocked(gid){
    unlockedGroups.add(gid);
    safeLocalSet("unlockedGroups", JSON.stringify(Array.from(unlockedGroups)));
  }
  function isCurrentGroupLocked(){
    const group = groups.find(g => g.id === currentGroupId);
    return !!(group && group.passwordHash && !unlockedGroups.has(currentGroupId) && !canBypassGroupPassword());
  }

  function isLeader(){ return appRole === "leader_male" || appRole === "leader_female"; }
  function isSupervisor(){ return appRole === "supervisor"; }
  function canBypassGroupPassword(){ return isLeader() || isSupervisor(); }
  function visibleGroups(){
    if (isLeader()) return groups.slice();
    if (isSupervisor()) {
      const allowed = new Set(Array.isArray(appProfile?.groupIds) ? appProfile.groupIds : []);
      return groups.filter(g => allowed.has(g.id));
    }
    return groups.slice();
  }
  function roleLabel(){
    if (appRole === "leader_male") return "Líder de Varones";
    if (appRole === "leader_female") return "Líder de Mujeres";
    if (appRole === "supervisor") return "Supervisor";
    return "Coordinador de grupo";
  }
  function shareDisplayName(id){ return id === "__DE_TRAJE__" ? "De traje" : ((people.find(p => p.id === id) || {}).name || "Sin compartir"); }
  function shareDisplayIcon(id){ return id === "__DE_TRAJE__" ? "🍽️" : "🍽️"; }
  function guestStatusLabel(status){ return status === "continues" ? "Continúa" : status === "not_continues" ? "No continuó" : "Seleccionar"; }
  function guestStatusClass(status){ return status === "continues" ? "pill-superada" : status === "not_continues" ? "pill-proceso" : ""; }
  function normalizeGuestName(name){ return String(name || "").trim().toLowerCase().replace(/\s+/g, " "); }
  function legacyGuestsFromMeeting(m){
    if (Array.isArray(m.guests)) return m.guests.map((g,i) => ({ id:g.id || ("legacy-" + i), name:g.name || "", status:g.status || "" })).filter(g => g.name);
    if (Array.isArray(m.guestNames)) return m.guestNames.map((name,i) => ({ id:"legacy-" + i, name:String(name || "").trim(), status:"" })).filter(g => g.name);
    return [];
  }
  function guestRowsToUI(rows){
    const box=document.getElementById("meetingGuestsList");
    if(!box) return;
    meetingGuestRows=(rows||[]).map((g,i)=>({id:g.id || ("row-"+i), name:g.name||"", status:""}));
    if(!meetingGuestRows.length) meetingGuestRows=[{id:"row-1",name:"",status:""}];
    box.innerHTML=meetingGuestRows.map((g,i)=>`<div data-guest-row="${i}" class="card" style="padding:10px;margin-top:8px;background:var(--surface-2);border-radius:12px;box-shadow:none;">
      <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end;">
        <div><label style="font-size:11px;color:var(--text-dim);">Invitado ${i+1}</label><input data-guest-name value="${esc(g.name)}" placeholder="Nombre del invitado" /></div>
        <button type="button" class="btn-danger" data-remove-guest style="padding:8px 9px;">Quitar</button>
      </div>
    </div>`).join("");
    box.querySelectorAll("[data-guest-row]").forEach(row=>{
      const idx=Number(row.dataset.guestRow);
      row.querySelector("[data-guest-name]").oninput=e=>{ meetingGuestRows[idx].name=e.target.value; };
      row.querySelector("[data-remove-guest]").onclick=()=>{ meetingGuestRows.splice(idx,1); guestRowsToUI(meetingGuestRows); };
    });
  }
  async function promoteGuestToMember(name, meetingDateValue){
    const clean=String(name||"").trim(); if(!clean) return null;
    const norm=normalizeGuestName(clean);
    const existing=people.find(p=>normalizeGuestName(p.name)===norm);
    if(existing){
      if(existing.active===false) await db.doc("groups/"+currentGroupId+"/people/"+existing.id).update({active:true});
      return existing.id;
    }
    const ref=await db.collection("groups/"+currentGroupId+"/people").add({name:clean,active:true,memberType:"Miembro",joinDate:meetingDateValue||todayISO(),guestOrigin:true,createdAt:Date.now()});
    people.push({id:ref.id,name:clean,active:true,memberType:"Miembro",joinDate:meetingDateValue||todayISO(),guestOrigin:true});
    return ref.id;
  }
  async function upsertGuestRecord(guest, meetingDateValue){
    const clean=String(guest.name||"").trim(); if(!clean) return null;
    const norm=normalizeGuestName(clean);
    let ref=null;
    try {
      const q=await db.collection("groups/"+currentGroupId+"/guests").limit(300).get();
      const existing=q.docs.find(d=>normalizeGuestName((d.data()||{}).name)===norm);
      if(existing) ref=existing.ref;
    } catch(e) { /* si falla la consulta, se crea un registro nuevo */ }
    if(!ref) ref=db.collection("groups/"+currentGroupId+"/guests").doc();
    const existingData = ref ? ((await ref.get()).data() || {}) : {};
    const effectiveStatus = guest.status || existingData.status || "";
    const payload={name:clean,normalizedName:norm,status:effectiveStatus,firstMeetingDate:guest.firstMeetingDate||existingData.firstMeetingDate||meetingDateValue||todayISO(),lastMeetingDate:meetingDateValue||todayISO(),updatedAt:Date.now()};
    if(guest.status==="continues"){
      const memberId=await promoteGuestToMember(clean,meetingDateValue);
      payload.memberId=memberId; payload.continuedAt=payload.continuedAt||Date.now(); payload.active=false;
    } else {
      payload.active=true;
    }
    await ref.set(payload,{merge:true});
    return ref.id;
  }
  async function loadGuestList(){
    const box=document.getElementById("guestList"); if(!box) return;
    try{
      // Fuente principal: subcolección guests.
      const snap=await db.collection("groups/"+currentGroupId+"/guests").limit(300).get();
      let rows=snap.docs.map(d=>({id:d.id,...d.data()}));

      // Compatibilidad/migración: reuniones guardadas antes de crear la subcolección
      // también deben alimentar la lista de invitados.
      if(!rows.length){
        try{
          const ms=await db.collection("groups/"+currentGroupId+"/meetings").orderBy("date","desc").limit(500).get();
          const byName=new Map();
          for(const d of ms.docs){
            const m=d.data()||{};
            const guests=legacyGuestsFromMeeting(m);
            for(const g of guests){
              const norm=normalizeGuestName(g.name); if(!norm) continue;
              const prev=byName.get(norm);
              const candidate={name:g.name.trim(),status:g.status||"",firstMeetingDate:m.date||todayISO(),lastMeetingDate:m.date||todayISO()};
              if(!prev || String(candidate.lastMeetingDate)>String(prev.lastMeetingDate)){
                candidate.firstMeetingDate=prev ? (prev.firstMeetingDate||candidate.firstMeetingDate) : candidate.firstMeetingDate;
                byName.set(norm,candidate);
              } else if(prev && (!prev.firstMeetingDate || String(candidate.firstMeetingDate)<String(prev.firstMeetingDate))){
                prev.firstMeetingDate=candidate.firstMeetingDate;
              }
            }
          }
          rows=Array.from(byName.values());
          // Persist the recovered records so future cargas no dependan de la migración.
          for(const g of rows){ try{ await upsertGuestRecord(g,g.lastMeetingDate||todayISO()); }catch(e){} }
          const migrated=await db.collection("groups/"+currentGroupId+"/guests").limit(300).get();
          if(migrated.size) rows=migrated.docs.map(d=>({id:d.id,...d.data()}));
        }catch(e){}
      }
      guestList=rows.sort((a,b)=>String(b.lastMeetingDate||"").localeCompare(String(a.lastMeetingDate||"")));
      if(!guestList.length){ box.innerHTML='<div class="empty-state" style="padding:16px 8px;">Todavía no hay invitados registrados.</div>'; return; }
      box.innerHTML=guestList.map(g=>`<div data-guest-id="${esc(g.id)}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);">

  function blobToDataUrl(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function nativeDownload({ filename, data }){
    // Appilix: usar primero su módulo nativo File Downloader.
    // Al activar el módulo, Appilix intercepta los enlaces de descarga y
    // guarda el archivo en el dispositivo, mostrando su propio progreso.
    const isAppilix = typeof window.appilix !== "undefined";

    try {
      const url = URL.createObjectURL(data);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.setAttribute("download", filename);
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();

      // Dar tiempo al WebView/Appilix para tomar el enlace antes de liberar
      // el objeto Blob. En Appilix el File Downloader gestiona el guardado.
      setTimeout(() => URL.revokeObjectURL(url), isAppilix ? 30000 : 5000);
      return { status: isAppilix ? "download_started" : "saved" };
    } catch(e){
      // Respaldo para navegadores que no acepten Blob URLs.
      try {
        const dataUrl = await blobToDataUrl(data);
        const a2 = document.createElement("a");
        a2.href = dataUrl;
        a2.download = filename;
        a2.setAttribute("download", filename);
        a2.style.display = "none";
        document.body.appendChild(a2);
        a2.click();
        a2.remove();
        return { status: "saved" };
      } catch(err){
        // Último respaldo: compartir el archivo si el dispositivo lo soporta.
        if (navigator.canShare && navigator.share){
          const file = new File([data], filename, { type: data.type || "application/octet-stream" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: filename });
            return { status: "shared" };
          }
        }
        throw err;
      }
    }
  }

      const allGroups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      groups = visibleGroupsFrom(allGroups);
      if (!currentGroupId && groups.length){
        currentGroupId = groups[0].id;

      refreshGroupAccess();

  function formatDateShort(dateStr){

  async function loadPersonAttendanceStats(){
    personAttendanceStats = {};
    if (!currentGroupId) return;
    try {
      const snap = await db.collection("groups/" + currentGroupId + "/attendance").orderBy("date","asc").limit(500).get();
      snap.docs.forEach(d => {
        const a=d.data()||{}; const date=a.date||d.id; const present=a.present||{};
        Object.keys(present).forEach(pid => {
          if (present[pid] !== true) return;
          if (!personAttendanceStats[pid]) personAttendanceStats[pid]={firstDate:date,lastDate:date,count:0};
          const st=personAttendanceStats[pid];
          st.count++;
          if (!st.firstDate || date < st.firstDate) st.firstDate=date;
          if (!st.lastDate || date > st.lastDate) st.lastDate=date;
        });
      });
    } catch(e) { /* el control de asistencia seguirá funcionando aunque no pueda cargar el resumen */ }
  }

  function timeSince(dateStr){
    if (!dateStr) return "";
    const start = new Date(dateStr + "T00:00:00");
    if (isNaN(start.getTime())) return "";
    const now = new Date();
    let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
    if (now.getDate() < start.getDate()) months--;
    if (months < 0) months = 0;
    const years = Math.floor(months / 12);
    const remMonths = months % 12;
    const parts = [];
    if (years > 0) parts.push(years + (years === 1 ? " año" : " años"));
    if (remMonths > 0 || years === 0) parts.push(remMonths + (remMonths === 1 ? " mes" : " meses"));
    return parts.join(", ");
  }

  const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  function birthdayParts(dateStr){
    if (!dateStr) return null;
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return null;
    return { month: d.getMonth(), day: d.getDate() };
  }

  function formatBirthdayShort(dateStr){
    const parts = birthdayParts(dateStr);
    if (!parts) return "";
    return parts.day + " de " + MONTH_NAMES[parts.month];
  }

  function personDetailsSummary(p){
    const parts = [];
    if (p.unionFree) {
      let union = "Unión libre" + (p.partnerName ? " con " + p.partnerName : "");
      if (p.unionFrom) union += " desde " + p.unionFrom;
      if (p.unionCurrent) union += " · Actualidad";
      else if (p.unionTo) union += " hasta " + p.unionTo;
      parts.push(union);
    } else if (!p.married) {
      parts.push("Soltero(a)");
    }
    if (p.married) {
      let marriage = "Casado(a)" + (p.spouseName ? " con " + p.spouseName : "");
      if (p.marriageDate) marriage += " desde " + p.marriageDate;
      if (p.marriageYears != null && p.marriageYears !== "") marriage += " (" + p.marriageYears + (Number(p.marriageYears)===1?" año":" años") + ")";
      parts.push(marriage);
    }
    if (p.memberType) parts.push("Tipo: " + p.memberType);
    if (p.sex) parts.push("Sexo: " + p.sex);
    parts.push(p.hasChildren ? "Hijos: " + (p.childrenCount != null && p.childrenCount !== "" ? p.childrenCount : "sí") : "Sin hijos");
    if (p.phone) parts.push("Cel: " + p.phone);
    if (p.birthday) parts.push("Cumpleaños: " + formatBirthdayShort(p.birthday));
    if (p.joinDate){
      const dur = timeSince(p.joinDate);
      parts.push("En el grupo desde " + p.joinDate + (dur ? " (" + dur + ")" : ""));
    }
    return parts.join(" · ");
  }

  function marriageDurationYears(dateStr){
    if (!dateStr) return null;
    const start = new Date(dateStr + "T00:00:00");
    if (isNaN(start.getTime())) return null;
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    const anniversary = new Date(now.getFullYear(), start.getMonth(), start.getDate());
    if (now < anniversary) years--;
    return Math.max(0, years);
  }

  function openPersonProfile(p){
    const host=document.getElementById("moreSheet");
    if(!host) return;
    const situations=(situationsCache[p.id]||[]);
    const important=situations.filter(x=>x.category==="importante" && x.status!=="superada").length;
    const relationship = [];
    if (p.unionFree) relationship.push("<div><b>Unión libre:</b> " + esc(p.partnerName || "Sin nombre") + (p.unionFrom ? " · desde " + esc(p.unionFrom) : "") + (p.unionCurrent ? " · actualidad" : (p.unionTo ? " · hasta " + esc(p.unionTo) : "")) + "</div>");
    if (p.married) relationship.push("<div><b>Matrimonio:</b> " + esc(p.spouseName || "Sin nombre") + (p.marriageDate ? " · fecha: " + esc(p.marriageDate) : "") + (p.marriageYears != null && p.marriageYears !== "" ? " · " + esc(String(p.marriageYears)) + (Number(p.marriageYears)===1 ? " año" : " años") : "") + "</div>");
    if (!relationship.length) relationship.push("<div><b>Estado civil:</b> Soltero(a)</div>");
    const infoRows = [
      ["Tipo dentro del grupo", p.memberType || "—"],
      ["Sexo", p.sex || "—"],
      ["Celular", p.phone || "—"],
      ["Cumpleaños", p.birthday || "—"],
      ["Ingreso al grupo", p.joinDate || "—"],
      ["Hijos", p.hasChildren ? (p.childrenCount != null && p.childrenCount !== "" ? String(p.childrenCount) : "Sí") : "No"]
    ];
    host.style.display="block";
    host.innerHTML=`<div class="more-sheet" id="profileBackdrop"><div class="more-panel" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;"><div class="brand-mark" style="width:46px;height:46px;">👤</div><div style="min-width:0;"><div style="font-size:19px;font-weight:850;word-break:break-word;">${esc(p.name)}</div><div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${esc(p.memberType||"Miembro")} ${p.sex?"· "+esc(p.sex):""}</div></div></div>
        <button class="btn-ghost" id="closeProfileBtn">Cerrar</button>
      </div>
      <div class="stat-grid" style="margin-top:16px;">
        <div class="card stat-card"><div class="stat-icon">📅</div><div class="stat-value" style="font-size:18px;">${esc(p.joinDate||"—")}</div><div class="stat-label">Ingreso al grupo</div></div>
        <div class="card stat-card"><div class="stat-icon">🎂</div><div class="stat-value" style="font-size:18px;">${esc(p.birthday||"—")}</div><div class="stat-label">Cumpleaños</div></div>
        <div class="card stat-card"><div class="stat-icon">📱</div><div class="stat-value" style="font-size:16px;">${esc(p.phone||"—")}</div><div class="stat-label">Celular</div></div>
        <div class="card stat-card"><div class="stat-icon">🙏</div><div class="stat-value" style="font-size:18px;">${important}</div><div class="stat-label">Situaciones importantes</div></div>
      </div>
      <div class="section-title">Información personal</div>
      <div class="card" style="padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;">${infoRows.map(r=>`<div><div style="font-size:11px;color:var(--text-dim);">${esc(r[0])}</div><div style="font-size:13px;font-weight:700;">${esc(r[1])}</div></div>`).join("")}</div>
      <div class="section-title">Estado familiar</div>
      <div class="card" style="padding:12px;font-size:13px;line-height:1.7;">${relationship.join("")}</div>
      <div class="section-title">Situaciones registradas</div>
      <div class="card" style="padding:12px;">${situations.length ? situations.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);"><b>${esc(x.description||"Situación")}</b><div style="font-size:11px;color:var(--text-dim);margin-top:3px;">${esc(x.date||"")} · ${esc(x.status||"")}</div></div>`).join("") : '<div style="font-size:13px;color:var(--text-dim);">Sin situaciones registradas.</div>'}</div>
    </div></div>`;
    document.getElementById("closeProfileBtn").onclick=closeMoreSheet;
    document.getElementById("profileBackdrop").onclick=closeMoreSheet;
  }

  function wirePersonCard(card, p){
    const profileBtn = card.querySelector('[data-act="view-profile"]');
    if (profileBtn) profileBtn.onclick = () => openPersonProfile(p);
    const detailsBtn = card.querySelector('[data-act="toggle-person-details"]');
    if (detailsBtn) detailsBtn.onclick = () => {
      const details = card.querySelector('[data-role="person-details"]');
      const expanded = details.style.display !== "none";
      details.style.display = expanded ? "none" : "block";
      detailsBtn.textContent = expanded ? "Ver detalle⌄" : "Ocultar detalle⌃";
      detailsBtn.setAttribute("aria-expanded", expanded ? "false" : "true");
    };
    card.querySelector('[data-act="toggle-sit-form"]').onclick = () => {
      const form = card.querySelector('[data-role="sit-form"]');
      form.style.display = form.style.display === "none" ? "block" : "none";
    };
    card.querySelector('[data-act="toggle-edit-person"]').onclick = () => {
      const form = card.querySelector('[data-role="person-edit-form"]');
      form.style.display = form.style.display === "none" ? "flex" : "none";
    };
    card.querySelector('[data-act="cancel-edit-person"]').onclick = () => {
      card.querySelector('[data-role="person-edit-form"]').style.display = "none";
    };
    card.querySelector('[data-role="edit-married"]').onchange = (e) => {
      card.querySelector('[data-role="married-fields"]').style.display = e.target.checked ? "flex" : "none";
    };
    card.querySelector('[data-role="edit-union-free"]').onchange = (e) => {
      card.querySelector('[data-role="union-fields"]').style.display = e.target.checked ? "flex" : "none";
    };
    card.querySelector('[data-role="edit-union-current"]').onchange = (e) => {
      const to = card.querySelector('[data-role="edit-union-to"]');
      if (e.target.checked) to.value = "";
      to.disabled = e.target.checked;
    };
    card.querySelector('[data-role="edit-union-current"]').dispatchEvent(new Event('change'));
    card.querySelector('[data-role="edit-has-children"]').onchange = (e) => {
      card.querySelector('[data-role="children-fields"]').style.display = e.target.checked ? "flex" : "none";
    };
    card.querySelector('[data-act="save-person-name"]').onclick = async () => {
      const input = card.querySelector('[data-role="person-name-input"]');
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      const phone = card.querySelector('[data-role="edit-phone"]').value.trim();
      const birthday = card.querySelector('[data-role="edit-birthday"]').value || null;
      const married = card.querySelector('[data-role="edit-married"]').checked;
      const spouseName = card.querySelector('[data-role="edit-spouse"]').value.trim();
      const marriageDate = card.querySelector('[data-role="edit-marriage-date"]').value || null;
      const marriageYearsRaw = card.querySelector('[data-role="edit-marriage-years"]').value;
      const manualMarriageYears = marriageYearsRaw === "" ? null : Number(marriageYearsRaw);
      const marriageYears = marriageDate ? marriageDurationYears(marriageDate) : manualMarriageYears;
      const hasChildren = card.querySelector('[data-role="edit-has-children"]').checked;
      const childrenCountRaw = card.querySelector('[data-role="edit-children-count"]').value;
      const childrenCount = childrenCountRaw === "" ? null : Number(childrenCountRaw);
      const joinDate = card.querySelector('[data-role="edit-join-date"]').value || null;
      const retreatValue = card.querySelector('[data-role="edit-retreat-attended"]').value;
      const retreatAttended = retreatValue === "" ? null : retreatValue === "true";
      const memberType = card.querySelector('[data-role="edit-member-type"]').value || null;
      const sex = card.querySelector('[data-role="edit-sex"]').value || null;
      const unionFree = card.querySelector('[data-role="edit-union-free"]').checked;
      const partnerName = card.querySelector('[data-role="edit-partner"]').value.trim();
      const unionFrom = card.querySelector('[data-role="edit-union-from"]').value || null;
      const unionCurrent = card.querySelector('[data-role="edit-union-current"]').checked;
      const unionTo = unionCurrent ? null : (card.querySelector('[data-role="edit-union-to"]').value || null);
      setStatus("Guardando cambios…");
      try {
        await db.doc("groups/" + currentGroupId + "/people/" + p.id).update({
          name,
          phone: phone || null,
          birthday,
          married,
          spouseName: married ? spouseName : null,
          marriageDate: married ? marriageDate : null,
          marriageYears: married ? marriageYears : null,
          hasChildren,
          childrenCount: hasChildren ? childrenCount : null,
          joinDate,
          retreatAttended,
          memberType,
          sex,
          unionFree,
          partnerName: unionFree ? (partnerName || null) : null,
          unionFrom: unionFree ? unionFrom : null,
          unionTo: unionFree ? unionTo : null,
          unionCurrent: unionFree ? unionCurrent : false
        });
        card.querySelector('[data-role="person-edit-form"]').style.display = "none";
        setStatus("");
      } catch(e){ setStatus("Error: " + e.code); }
    };
    const deactivateBtn = card.querySelector('[data-act="deactivate"]');
    deactivateBtn.onclick = async () => {
      if (deactivateBtn.dataset.confirming !== "1"){
        deactivateBtn.dataset.confirming = "1";
        deactivateBtn.textContent = "¿Seguro? Toca de nuevo";
        setTimeout(() => { deactivateBtn.dataset.confirming = "0"; deactivateBtn.textContent = "Inactivar"; }, 4000);
        return;
      }
      try {
        const now= todayISO();
        const history=Array.isArray(p.deactivationHistory)?p.deactivationHistory.slice():[];
        history.push({date:now});
        await db.doc("groups/" + currentGroupId + "/people/" + p.id).update({ active:false, deactivatedAt:now, deactivationHistory:history });
        setStatus("Miembro inactivado y fecha guardada.");
      } catch(e){ setStatus("Error: " + e.code); }
    };
    const deleteBtn = card.querySelector('[data-act="delete-person"]');
    deleteBtn.onclick = async () => {
      if (deleteBtn.dataset.confirming !== "1"){
        deleteBtn.dataset.confirming = "1";
        deleteBtn.textContent = "¿Eliminar todo? Toca de nuevo";
        setTimeout(() => { deleteBtn.dataset.confirming = "0"; deleteBtn.textContent = "Eliminar"; }, 4000);
        return;
      }
      setStatus("Eliminando persona…");
      try {
        const sitsSnap = await db.collection("groups/" + currentGroupId + "/people/" + p.id + "/situations").get();
        for (const d of sitsSnap.docs){
          await db.doc("groups/" + currentGroupId + "/people/" + p.id + "/situations/" + d.id).delete();
        }
        await db.doc("groups/" + currentGroupId + "/people/" + p.id).delete();
        setStatus("Persona eliminada.");
      } catch(e){ setStatus("Error: " + e.code); }
    };
    card.querySelector('[data-act="save-sit"]').onclick = async () => {
      const desc = card.querySelector('[data-role="sit-desc"]').value.trim();
      const date = card.querySelector('[data-role="sit-date"]').value || todayISO();
      const status = card.querySelector('[data-role="sit-status"]').value;
      const category = card.querySelector('[data-role="sit-category"]').value || "otra";
      if (!desc){ setStatus("Escribe una descripción de la situación."); return; }
      setStatus("Guardando situación…");
      try {
        await db.collection("groups/" + currentGroupId + "/people/" + p.id + "/situations").add({
          description: desc, status, startDate: date, category, notes: [], createdAt: Date.now()
        });
        card.querySelector('[data-role="sit-desc"]').value = "";
        card.querySelector('[data-role="sit-form"]').style.display = "none";
        setStatus("");
        loadSituations(p.id);
      } catch(e){ setStatus("Error: " + e.code); }
    };
  }

  async function loadSituations(personId){
    try {
      const snap = await db.collection("groups/" + currentGroupId + "/people/" + personId + "/situations").orderBy("createdAt","desc").get();
      situationsCache[personId] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e){
      situationsCache[personId] = [];
    }
    if (activeTab === "personas") renderSituationsBlock(personId);
  }

  function renderSituationsBlock(personId){
    const block = document.querySelector(`[data-role="situations"][data-person="${personId}"]`) ||
                  Array.from(document.querySelectorAll('[data-role="situations"]')).find(b => b.closest(".card") && b.dataset.person === personId);
    // Find the container by matching person id stored as dataset when rendering initial card; simpler: re-render whole list
    renderPersonasSituationsOnly();
  }

  function renderPersonasSituationsOnly(){
    // Re-render each person's situations block in place without rebuilding the whole tab (avoids losing form open state mostly)
    document.querySelectorAll("#peopleList > .card").forEach((card, idx) => {
      const activos = people.filter(p => p.active !== false);
      const p = activos[idx];
      if (!p) return;
      const container = card.querySelector('[data-role="situations"]');
      const sits = situationsCache[p.id];
      if (sits === undefined){ container.innerHTML = '<div style="color:var(--text-dim); font-size:13px;">Cargando situaciones…</div>'; return; }
      if (!sits.length){ container.innerHTML = '<div style="color:var(--text-dim); font-size:13px;">Sin situaciones registradas.</div>'; return; }
      const importantes = sits.filter(s => s.category === "importante");
      const otras = sits.filter(s => s.category !== "importante");
      let html = "";
      if (importantes.length){
        html += '<div style="font-size:12px; font-weight:700; color:var(--accent); margin-top:4px;">Temas importantes</div>';
        html += importantes.map(s => situationHTML(p.id, s)).join("");
      }
      if (otras.length){
        html += '<div style="font-size:12px; font-weight:700; color:var(--text-dim); margin-top:4px;">Otras luchas o situaciones</div>';
        html += otras.map(s => situationHTML(p.id, s)).join("");
      }
      container.innerHTML = html;
      sits.forEach(s => wireSituation(container, p.id, s));
    });
  }

  function situationHTML(personId, s){

    const isImportant = s.category === "importante";
    return `
      <div class="card" style="padding:10px; background:var(--surface-2); border:1px solid var(--border);" data-sit="${s.id}">

          <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start;">
            <div style="font-weight:600;">${esc(s.description)}</div>
            <div style="display:flex; gap:4px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;">
              ${isImportant ? '<span class="pill" style="background:var(--warn-bg); color:var(--warn);">Importante</span>' : ""}

            </div>
          </div>
          <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Desde ${esc(s.startDate || "—")}</div>

            <button class="btn-ghost" style="padding:4px 10px; font-size:12px;" data-act="toggle-status">
              ${s.status==='superada' ? 'Marcar en proceso' : 'Marcar superada'}
            </button>
            <button class="btn-ghost" style="padding:4px 10px; font-size:12px;" data-act="toggle-note-form">+ Anotación semanal</button>
            <button class="btn-ghost" style="padding:4px 10px; font-size:12px;" data-act="toggle-edit-sit">Editar</button>
            <button class="btn-danger" style="padding:4px 10px; font-size:12px;" data-act="delete-sit">Eliminar</button>
          </div>
        </div>
        <div data-role="sit-edit-form" style="display:none; margin-top:8px; flex-direction:column; gap:6px; padding-top:8px; border-top:1px solid var(--border);">
          <input data-role="edit-desc" value="${esc(s.description)}" placeholder="Situación con la que lucha" />
          <div>

  function noteMatchIndex(arr, note){
    return arr.findIndex(n => n.date === note.date && n.text === note.text);
  }

  function wireSituation(container, personId, s){
    const box = container.querySelector(`[data-sit="${s.id}"]`);
    if (!box) return;
    const sitRef = db.doc("groups/" + currentGroupId + "/people/" + personId + "/situations/" + s.id);

    box.querySelector('[data-act="toggle-status"]').onclick = async () => {
      const newStatus = s.status === "superada" ? "proceso" : "superada";
      try { await sitRef.update({ status: newStatus }); loadSituations(personId); }
      catch(e){ setStatus("Error: " + e.code); }
    };

    const noteForm = box.querySelector('[data-role="note-form"]');
    box.querySelector('[data-act="toggle-note-form"]').onclick = () => {
      noteForm.style.display = noteForm.style.display === "none" ? "flex" : "none";
    };
    box.querySelector('[data-act="save-note"]').onclick = async () => {
      const date = box.querySelector('[data-role="note-date"]').value || todayISO();
      const text = box.querySelector('[data-role="note-text"]').value.trim();
      if (!text) return;
      setStatus("Guardando anotación…");
      try {
        const fresh = await sitRef.get();
        const currentNotes = (fresh.exists && fresh.data().notes) ? fresh.data().notes : [];
        await sitRef.update({ notes: currentNotes.concat([{ date, text }]) });
        setStatus("");
        loadSituations(personId);
      } catch(e){ setStatus("Error: " + e.code); }
    };

    const editForm = box.querySelector('[data-role="sit-edit-form"]');
    box.querySelector('[data-act="toggle-edit-sit"]').onclick = () => {
      editForm.style.display = editForm.style.display === "none" ? "flex" : "none";
    };
    box.querySelector('[data-act="cancel-edit-sit"]').onclick = () => {
      editForm.style.display = "none";
    };
    box.querySelector('[data-act="save-edit-sit"]').onclick = async () => {
      const desc = box.querySelector('[data-role="edit-desc"]').value.trim();
      const date = box.querySelector('[data-role="edit-date"]').value || s.startDate || todayISO();
      const status = box.querySelector('[data-role="edit-status"]').value;
      const category = box.querySelector('[data-role="edit-category"]').value || "otra";
      if (!desc){ setStatus("Escribe una descripción de la situación."); return; }
      setStatus("Guardando cambios…");
      try {
        await sitRef.update({ description: desc, startDate: date, status, category });
        editForm.style.display = "none";
        setStatus("");
        loadSituations(personId);
      } catch(e){ setStatus("Error: " + e.code); }
    };

    const deleteSitBtn = box.querySelector('[data-act="delete-sit"]');
    deleteSitBtn.onclick = async () => {
      if (deleteSitBtn.dataset.confirming !== "1"){
        deleteSitBtn.dataset.confirming = "1";
        deleteSitBtn.textContent = "¿Seguro? Toca de nuevo";
        setTimeout(() => { deleteSitBtn.dataset.confirming = "0"; deleteSitBtn.textContent = "Eliminar"; }, 4000);
        return;
      }
      setStatus("Eliminando situación…");
      try { await sitRef.delete(); loadSituations(personId); }
      catch(e){ setStatus("Error: " + e.code); }
    };

    const notesSorted = (s.notes || []).slice().sort((a,b) => (a.date < b.date ? 1 : -1));
    box.querySelectorAll('[data-note-idx]').forEach(noteEl => {
      const idx = Number(noteEl.dataset.noteIdx);
      const note = notesSorted[idx];
      if (!note) return;
      const noteEditForm = noteEl.querySelector('[data-role="note-edit-form"]');
      noteEl.querySelector('[data-act="edit-note"]').onclick = () => {
        noteEditForm.style.display = noteEditForm.style.display === "none" ? "flex" : "none";
      };
      noteEl.querySelector('[data-act="cancel-note-edit"]').onclick = () => {
        noteEditForm.style.display = "none";
      };
      noteEl.querySelector('[data-act="save-note-edit"]').onclick = async () => {
        const newDate = noteEl.querySelector('[data-role="note-edit-date"]').value || note.date;
        const newText = noteEl.querySelector('[data-role="note-edit-text"]').value.trim();
        if (!newText) return;
        setStatus("Guardando anotación…");
        try {
          const fresh = await sitRef.get();
          const currentNotes = (fresh.exists && fresh.data().notes) ? fresh.data().notes.slice() : [];
          const i = noteMatchIndex(currentNotes, note);
          if (i >= 0) currentNotes[i] = { date: newDate, text: newText };
          await sitRef.update({ notes: currentNotes });
          setStatus("");
          loadSituations(personId);
        } catch(e){ setStatus("Error: " + e.code); }
      };
      noteEl.querySelector('[data-act="delete-note"]').onclick = async () => {
        setStatus("Eliminando anotación…");
        try {
          const fresh = await sitRef.get();
          const currentNotes = (fresh.exists && fresh.data().notes) ? fresh.data().notes.slice() : [];
          const i = noteMatchIndex(currentNotes, note);
          if (i >= 0) currentNotes.splice(i, 1);
          await sitRef.update({ notes: currentNotes });
          setStatus("");
          loadSituations(personId);
        } catch(e){ setStatus("Error: " + e.code); }
      };
    });
  }

  function renderAttList(activos, presentMap){

  async function loadAttendanceForDate(activos){
    attendanceDate = document.getElementById("attDate").value || todayISO();
    setStatus("Cargando asistencia…");
    try {
      const ref = db.doc("groups/" + currentGroupId + "/attendance/" + attendanceDate);
      const snap = await ref.get();
      const present = (snap.exists && snap.data().present) ? snap.data().present : {};
      const savedGuests = (snap.exists && Array.isArray(snap.data().guests)) ? snap.data().guests : [];
      const mSnap = await db.doc("groups/" + currentGroupId + "/meetings/" + attendanceDate).get();
      const meetingGuests = mSnap.exists ? legacyGuestsFromMeeting(mSnap.data()).filter(g=>g.name) : [];
      const guests = savedGuests.length ? savedGuests : meetingGuests;
      renderAttList(activos, present);
      const guestInfo=document.getElementById("attGuestInfo");
      if(guestInfo) guestInfo.innerHTML=guests.length ? `<div style="font-size:12px;color:var(--text-dim);">Invitados contabilizados en la participación: <strong>${guests.length}</strong> · ${esc(guests.map(g=>g.name).join(", "))}</div>` : '<div style="font-size:12px;color:var(--text-dim);">Sin invitados registrados para esta reunión.</div>';
      setStatus("");
    } catch(e){ setStatus("Error: " + e.code); }
  }

  async function saveAttendance(activos){
    attendanceDate = document.getElementById("attDate").value || todayISO();
    setStatus("Guardando asistencia…");
    try {
      // Guardamos explícitamente a todos los miembros activos para que cada registro
      // tenga un denominador consistente y no se interpreten los ausentes como
      // "miembros no registrados".
      const completePresentMap = {};
      activos.forEach(p => { completePresentMap[p.id] = attendanceState[p.id] === true; });
      const meetingSnap=await db.doc("groups/"+currentGroupId+"/meetings/"+attendanceDate).get();
      const meetingGuests=meetingSnap.exists ? legacyGuestsFromMeeting(meetingSnap.data()).filter(g=>g.name) : [];
      await db.doc("groups/" + currentGroupId + "/attendance/" + attendanceDate).set({
        date: attendanceDate, present: completePresentMap, guests: meetingGuests, updatedAt: Date.now()
      });
      // Guardamos también en cada ficha la primera y última fecha en que asistió,
      // sin eliminar el historial de asistencias de la colección attendance.
      for (const p of activos) {
        if (completePresentMap[p.id] !== true) continue;
        const first = p.firstAttendanceDate ? (attendanceDate < p.firstAttendanceDate ? attendanceDate : p.firstAttendanceDate) : attendanceDate;
        const last = p.lastAttendanceDate ? (attendanceDate > p.lastAttendanceDate ? attendanceDate : p.lastAttendanceDate) : attendanceDate;
        await db.doc("groups/" + currentGroupId + "/people/" + p.id).update({ firstAttendanceDate:first, lastAttendanceDate:last });
      }
      await loadPersonAttendanceStats();
      setStatus("Asistencia guardada.");
      loadAttendanceHistory();
    } catch(e){ setStatus("Error: " + e.code); }
  }

  async function loadAttendanceHistory(){
    try {
      const snap = await db.collection("groups/" + currentGroupId + "/attendance").orderBy("date","desc").limit(8).get();
      attendanceHistory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const box = document.getElementById("attHistory");
      if (!box) return;
      if (!attendanceHistory.length){ box.textContent = "Sin registros de asistencia todavía."; return; }
      const activosActuales = people.filter(p => p.active !== false);
      box.innerHTML = attendanceHistory.map(a => {
        const presentMap = a.present || {};
        // En registros antiguos puede que solo se hayan guardado los presentes.
        // El total debe ser el número de miembros activos, no la cantidad de claves.
        const total = activosActuales.length;
        const presentes = activosActuales.filter(p => presentMap[p.id] === true).length;
        const guestCount=Array.isArray(a.guests)?a.guests.length:0;
        const totalParticipantes=total+guestCount;
        const pct = totalParticipantes ? Math.round(((presentes+guestCount)/totalParticipantes)*100) : 0;
        return `<div data-hist-date="${esc(a.date)}" style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 2px; border-bottom:1px solid var(--border);">
          <div>
            <div>${esc(a.date)}</div>
            <div style="color:var(--text-dim);">${presentes+guestCount}/${totalParticipantes} participantes · ${pct}%${guestCount?" · "+guestCount+" invitados":""}</div>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="btn-ghost" data-act="hist-edit" style="padding:4px 10px; font-size:12px;">Editar</button>
            <button class="btn-danger" data-act="hist-delete" style="padding:4px 10px; font-size:12px;">Eliminar</button>
          </div>
        </div>`;
      }).join("");
      box.querySelectorAll("[data-hist-date]").forEach(row => {
        const dateVal = row.dataset.histDate;
        row.querySelector('[data-act="hist-edit"]').onclick = () => {
          attendanceDate = dateVal;
          const dateInput = document.getElementById("attDate");
          if (dateInput) dateInput.value = attendanceDate;
          const activos = people.filter(p => p.active !== false);
          loadAttendanceForDate(activos);
          setStatus("Editando la asistencia del " + dateVal + ". Cambia lo necesario y toca \"Guardar asistencia\".");
        };
        const delBtn = row.querySelector('[data-act="hist-delete"]');
        delBtn.onclick = async () => {
          if (delBtn.dataset.confirming !== "1"){
            delBtn.dataset.confirming = "1";
            delBtn.textContent = "¿Seguro?";
            setTimeout(() => { delBtn.dataset.confirming = "0"; delBtn.textContent = "Eliminar"; }, 4000);
            return;
          }
          setStatus("Eliminando registro…");
          try {
            await db.doc("groups/" + currentGroupId + "/attendance/" + dateVal).delete();
            setStatus("Registro eliminado.");
            loadAttendanceHistory();
          } catch(e){ setStatus("Error: " + e.code); }
        };
      });
    } catch(e){ /* ignore */ }
  }

  function renderCumpleanos(){
    const el = document.getElementById("content");
    const activos = people.filter(p => p.active !== false);
    if (!activos.length){
      el.innerHTML = '<div class="card" style="padding:16px;">Agrega personas en la pestaña "Personas" primero.</div>';
      return;
    }
    const byMonth = {};
    activos.forEach(p => {
      const parts = birthdayParts(p.birthday);
      if (!parts) return;
      if (!byMonth[parts.month]) byMonth[parts.month] = [];
      byMonth[parts.month].push({ name: p.name, day: parts.day, phone: p.phone });
    });
    Object.values(byMonth).forEach(arr => arr.sort((a,b) => a.day - b.day));
    const currentMonth = new Date().getMonth();
    const anySet = activos.some(p => p.birthday);

    let html = '<div style="display:flex; flex-direction:column; gap:10px;">';
    if (!anySet){
      html += '<div class="card" style="padding:14px; color:var(--text-dim); font-size:13px;">Todavía no has registrado fechas de cumpleaños. Edita a cada persona en la pestaña "Personas" para agregarla.</div>';
    }
    for (let m = 0; m < 12; m++){
      const list = byMonth[m] || [];
      const isCurrent = m === currentMonth;
      html += `<div class="card" style="padding:12px; ${isCurrent ? "border:1px solid var(--accent);" : ""}">
        <div style="font-weight:700; ${isCurrent ? "color:var(--accent);" : ""}">${MONTH_NAMES[m]}${isCurrent ? " · mes actual" : ""}</div>
        ${list.length ? list.map(x => `
          <div style="display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid var(--border); margin-top:6px; font-size:14px;">
            <span>${esc(x.name)}</span>
            <span style="color:var(--text-dim);">Día ${x.day}${x.phone ? " · " + esc(x.phone) : ""}</span>
          </div>
        `).join("") : '<div style="color:var(--text-dim); font-size:13px; margin-top:6px;">Sin cumpleaños este mes.</div>'}
      </div>`;
    }
    html += "</div>";
    el.innerHTML = html;
  }

  async function saveMeeting(){
    meetingDate = document.getElementById("meetingDate").value || todayISO();
    const notes = document.getElementById("meetingNotes").value.trim();
    const hostId = document.getElementById("meetingHost").value || null;
    const shareId = document.getElementById("meetingShare").value || null;
    const newGuests = document.getElementById("meetingNewGuests").checked;
    const guestRows = newGuests ? meetingGuestRows.map(g=>({id:g.id,name:String(g.name||"").trim(),status:""})).filter(g=>g.name) : [];
    if(newGuests){
      if(!guestRows.length){ setStatus("Agrega al menos un invitado."); return; }
    }
    if (!hostId && !shareId && !notes && !newGuests){ setStatus("Registra al menos un dato de la reunión antes de guardar."); return; }
    setStatus("Guardando…");
    try {
      const savedGuests=[];
      for(const g of guestRows){
        const guestId=await upsertGuestRecord({...g,firstMeetingDate:g.firstMeetingDate||meetingDate},meetingDate);
        savedGuests.push({...g,id:guestId});
      }
      await db.doc("groups/" + currentGroupId + "/meetings/" + meetingDate).set({
        date: meetingDate, notes, hostId, shareId, newGuests, guests:savedGuests.map(g=>({id:g.id,name:g.name})), guestNames:savedGuests.map(g=>g.name), updatedAt: Date.now()
      },{merge:true});
      setStatus("Reunión guardada.");
      loadMeetingHistory();
      loadGuestList();
      // Si hubo nuevos miembros, refresca la lista oficial inmediatamente.
      if(savedGuests.some(g=>g.status==="continues")) subscribePeople();
    } catch(e){ setStatus("Error: " + e.code); }
  }

  async function loadMeetingHistory(){
    try {
      const snap = await db.collection("groups/" + currentGroupId + "/meetings").orderBy("date","desc").limit(10).get();

  // El plan se guarda en: groups/{groupId}/meetingPlan/{YYYY-MM-DD}

  let planRowsCache = [];

  function planDateLabel(iso){
    if (!iso) return "";
    const parts = iso.split("-");
    if (parts.length !== 3) return iso;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }

  function planWeekdayLabel(day){
    return String(day) === "2" ? "Martes" : "Miércoles";
  }

  function nextWeekdayDates(weekday, weeks){
    const result = [];
    const d = new Date();
    d.setHours(12,0,0,0);
    const jsDay = Number(weekday); // 2 martes, 3 miércoles
    const diff = (jsDay - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + diff);
    for (let i = 0; i < Number(weeks || 12); i++) {
      result.push(new Date(d));
      d.setDate(d.getDate() + 7);
    }
    return result.map(x => {
      const y = x.getFullYear();
      const m = String(x.getMonth()+1).padStart(2,"0");
      const day = String(x.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    });
  }

  function personOptions(selected){
    const active = people.filter(p => p.active !== false).slice().sort((a,b) => (a.name||"").localeCompare(b.name||""));
    return '<option value="">Seleccionar</option>' + active.map(p =>
      `<option value="${esc(p.id)}" ${p.id === selected ? "selected" : ""}>${esc(p.name)}</option>`
    ).join("");
  }

  function personOptionsWithDeTraje(selected){ return personOptions(selected) + `<option value="__DE_TRAJE__" ${selected === "__DE_TRAJE__" ? "selected" : ""}>🍽️ De traje</option>`; }

  async function loadPlanReuniones(){
    const box = document.getElementById("planList");
    if (!box) return;
    box.textContent = "Cargando…";
    try {
      const snap = await db.collection("groups/" + currentGroupId + "/meetingPlan").orderBy("date","asc").limit(200).get();
      const saved = snap.docs.map(d => ({id:d.id, ...d.data()}));
      const latestWeekday = saved.length && saved[0].weekday ? String(saved[0].weekday) : "2";
      const latestWeeks = saved.length ? Math.min(52, Math.max(4, saved.length)) : 12;
      const weekdayEl = document.getElementById("planWeekday");
      const weeksEl = document.getElementById("planWeeks");
      if (weekdayEl) weekdayEl.value = latestWeekday;
      if (weeksEl) weeksEl.value = String([4,8,12,16,24,52].includes(latestWeeks) ? latestWeeks : 12);
      if (saved.length) {
        planRowsCache = saved.map(x => ({date:x.date || x.id, weekday:String(x.weekday||latestWeekday), hostId:x.hostId||"", shareId:x.shareId||""}));
        renderPlanRows(true);
      } else {
        renderPlanRows(false);
      }
    } catch(e){
      // Si todavía no existe la subcolección, mostramos el formulario vacío.
      planRowsCache = [];
      renderPlanRows(false);
    }
  }

  function renderPlanRows(useSaved){
    const box = document.getElementById("planList");
    if (!box) return;
    const weekday = document.getElementById("planWeekday")?.value || "2";
    const weeks = Number(document.getElementById("planWeeks")?.value || 12);
    let existing = {};
    if (useSaved && planRowsCache.length) planRowsCache.forEach(r => existing[r.date] = r);
    const dates = nextWeekdayDates(weekday, weeks);
    planRowsCache = dates.map(date => ({
      date,
      weekday,
      hostId: existing[date]?.hostId || "",
      shareId: existing[date]?.shareId || ""
    }));

    box.innerHTML = `<div class="wrap-x"><table style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead><tr>
        <th style="text-align:left; padding:7px; border-bottom:1px solid var(--border);">Fecha</th>
        <th style="text-align:left; padding:7px; border-bottom:1px solid var(--border);">🏠 Anfitrión</th>
        <th style="text-align:left; padding:7px; border-bottom:1px solid var(--border);">🍽️ Compartir</th>
      </tr></thead>
      <tbody>${planRowsCache.map((r,i) => `<tr data-plan-index="${i}">
        <td style="padding:7px; border-bottom:1px solid var(--border); white-space:nowrap;"><strong>${planDateLabel(r.date)}</strong><div style="font-size:11px;color:var(--text-dim);">${planWeekdayLabel(r.weekday)}</div></td>
        <td style="padding:7px; border-bottom:1px solid var(--border);"><select data-plan-host="${i}" style="min-width:180px;">${personOptions(r.hostId)}</select></td>
        <td style="padding:7px; border-bottom:1px solid var(--border);"><select data-plan-share="${i}" style="min-width:180px;">${personOptionsWithDeTraje(r.shareId)}</select></td>
      </tr>`).join("")}</tbody>
    </table></div>`;

    box.querySelectorAll("[data-plan-host]").forEach(el => el.onchange = e => {
      planRowsCache[Number(e.target.dataset.planHost)].hostId = e.target.value;
    });
    box.querySelectorAll("[data-plan-share]").forEach(el => el.onchange = e => {
      planRowsCache[Number(e.target.dataset.planShare)].shareId = e.target.value;
    });
  }

  async function savePlanReuniones(){
    if (!planRowsCache.length){ setStatus("Primero genera las fechas del plan."); return; }
    setStatus("Guardando plan…");
    try {
      const batch = db.batch();
      planRowsCache.forEach(r => {
        const ref = db.doc("groups/" + currentGroupId + "/meetingPlan/" + r.date);
        batch.set(ref, {
          date:r.date,
          weekday:Number(r.weekday),
          hostId:r.hostId || null,
          shareId:r.shareId || null,
          updatedAt:Date.now()
        }, {merge:true});
      });
      await batch.commit();
      setStatus("Plan de reuniones guardado correctamente.");
      await loadPlanReuniones();
    } catch(e){ setStatus("Error al guardar el plan: " + (e.code || e.message || "error")); }
  }

  async function exportPlanExcel(){
    if (!window.XLSX){ setStatus("No se pudo cargar el módulo de Excel."); return; }
    if (!planRowsCache.length) await loadPlanReuniones();
    if (!planRowsCache.length){ setStatus("No hay fechas planificadas para exportar."); return; }
    try {
      const actualSnap = await db.collection("groups/" + currentGroupId + "/meetings").orderBy("date","asc").limit(500).get();
      const actual = actualSnap.docs.map(d => ({id:d.id,...d.data()}));
      const plannedSheet = planRowsCache.map(r => {
        const host = people.find(p => p.id === r.hostId);
        const share = people.find(p => p.id === r.shareId);
        return {
          "Fecha": r.date,
          "Día": planWeekdayLabel(r.weekday),
          "Anfitrión planificado": host ? host.name : "",
          "Compartir planificado": r.shareId === "__DE_TRAJE__" ? "De traje" : (share ? share.name : "")
        };
      });
      const actualSheet = actual.filter(m => planRowsCache.some(r => r.date === m.date)).map(m => {
        const host = people.find(p => p.id === m.hostId);
        const share = people.find(p => p.id === m.shareId);
        return {
          "Fecha": m.date || "",
          "Anfitrión realizado": host ? host.name : "",
          "Compartir realizado": m.shareId === "__DE_TRAJE__" ? "De traje" : (share ? share.name : ""),
          "Reunión registrada": "Sí"
        };
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(plannedSheet), "Plan de reuniones");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(actualSheet), "Reuniones realizadas");
      const data = XLSX.write(wb, {bookType:"xlsx", type:"array"});
      const blob = new Blob([data], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const grupo = groups.find(g => g.id === currentGroupId);
      const filename = "Plan_Reuniones_" + (grupo ? grupo.name : "grupo").replace(/\s+/g,"_") + ".xlsx";
      const result = await downloadsCap.save({filename, data:blob});
      setStatus(result.status === "download_started" ? "Descarga iniciada. Revisa la carpeta Descargas." : result.status === "saved" ? "Plan exportado a Excel." : "Archivo enviado para compartir.");
    } catch(e){ setStatus("No se pudo exportar el plan: " + (e.code || e.message || "error")); }
  }
