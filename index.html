        return row;
      });
      const persons=activos.map(p=>({"Persona":p.name,"Tipo":p.memberType||"","Sexo":p.sex||"","Unión libre":p.unionFree?"Sí":"No","Compañero/a":p.unionFree?(p.partnerName||""):"","Desde unión":p.unionFree?(p.unionFrom||""):"","Hasta unión":p.unionFree?(p.unionCurrent?"Actualidad":(p.unionTo||"")):"","Celular":p.phone||"","Cumpleaños":p.birthday||"","Fecha ingreso":p.joinDate||"","¿Asistió al retiro espiritual?":p.retreatAttended===true?"Sí":p.retreatAttended===false?"No":"","Estado civil anterior":p.married?"Casado(a)":"Soltero(a)","Cónyuge":p.married?(p.spouseName||""):"","Fecha de matrimonio":p.married?(p.marriageDate||""):"","Años de matrimonio":p.married?(p.marriageYears!=null?p.marriageYears:""):""}));
      const grupo=groups.find(g=>g.id===currentGroupId);
      let guestsForReport=guestList.slice();
      try { const gs=await db.collection("groups/"+currentGroupId+"/guests").limit(300).get(); guestsForReport=gs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.lastMeetingDate||"").localeCompare(String(a.lastMeetingDate||""))); } catch(e) {}

      // Nueva pestaña: control detallado de asistencia por fecha y por persona.
      // Cada fila representa a una persona en una fecha concreta, para poder
      // revisar quién asistió, quién faltó y quién fue invitado.
      const attSnap=await db.collection("groups/"+currentGroupId+"/attendance").orderBy("date","asc").limit(500).get();
      const attByDate={};
      attSnap.docs.forEach(d=>{const a=d.data()||{}; if(a.date) attByDate[a.date]=a;});
      const allDates=Array.from(new Set([...meetings.map(m=>m.date).filter(Boolean),...Object.keys(attByDate)])).sort();
      // Pestaña "Asistencia por fecha": contiene DOS bloques en la misma hoja:
      // 1) control matricial: personas en filas y fechas en columnas.
      // 2) resumen por fecha (totales y porcentaje).
      const attendanceSummaryByDate=[];
      const attendanceMatrixDates=allDates.slice();
      const attendanceMatrixPeople=[];
      const attendanceMatrixMap={};
      const ensureMatrixPerson=(key,name,kind)=>{
        if(!attendanceMatrixMap[key]){
          const row={"Persona":name,"__kind":kind};
          attendanceMatrixDates.forEach(d=>row[d]="—");
          attendanceMatrixMap[key]=row; attendanceMatrixPeople.push(row);
        }
        return attendanceMatrixMap[key];
      };
      activos.forEach(p=>ensureMatrixPerson("member:"+p.id,p.name||"", "Miembro oficial"));
      const attendanceDetailByDate=[];
      allDates.forEach(date=>{
        const a=attByDate[date]||{};
        const hasAttendanceRecord=Object.keys(a).length>0;
        const presentMap=a.present||{};
        let guests=Array.isArray(a.guests)?a.guests:[];
        const m=meetings.find(x=>x.date===date)||{};
        if(!guests.length && m) guests=legacyGuestsFromMeeting(m).filter(g=>g.name);

        const officialTotal=activos.length;
        const officialPresent=hasAttendanceRecord ? activos.filter(p=>presentMap[p.id]===true).length : null;
        const officialAbsent=hasAttendanceRecord ? Math.max(officialTotal-officialPresent,0) : null;
        const guestTotal=guests.length;
        const participantTotal=officialTotal+guestTotal;
        const participantPresent=hasAttendanceRecord ? officialPresent+guestTotal : null;
        const participationPct=hasAttendanceRecord && participantTotal>0 ? participantPresent/participantTotal : null;

        attendanceSummaryByDate.push({
          "Fecha":date,
          "Miembros oficiales":officialTotal,
          "Oficiales presentes":officialPresent==null?"":officialPresent,
          "Oficiales ausentes":officialAbsent==null?"":officialAbsent,
          "Invitados":guestTotal,
          "Participantes totales":participantTotal,
          "Participantes presentes":participantPresent==null?"":participantPresent,
          "% participación":participationPct==null?"":participationPct
        });

        // Miembros oficiales: aparecen aunque estén ausentes.
        activos.forEach(p=>{
          const matrixRow=ensureMatrixPerson("member:"+p.id,p.name||"", "Miembro oficial");
          const hasRecord=Object.prototype.hasOwnProperty.call(presentMap,p.id);
          matrixRow[date]=hasRecord ? (presentMap[p.id]===true ? "✓" : "X") : "—";
          const status=hasRecord ? (presentMap[p.id]===true ? "Presente" : "Ausente") : "Sin registro";
          attendanceDetailByDate.push({
            "Fecha":date,
            "Persona":p.name||"",
            "Tipo":p.memberType||"Miembro",
            "Categoría":"Miembro oficial",
            "Asistencia":status,
            "Decisión invitado":"",
            "Anfitrión":m.hostId===p.id?"Sí":"",
            "Compartir":m.shareId===p.id?"Sí":""
          });
        });

        // Invitados: se registran como participantes de esa reunión y en la matriz.
        guests.forEach(g=>{
          if(!g.name) return;
          const guestKey="guest:"+String(g.id||g.name).toLowerCase();
          const matrixRow=ensureMatrixPerson(guestKey,g.name,"Invitado");
          matrixRow[date]="Invitado";
          attendanceDetailByDate.push({
            "Fecha":date,
            "Persona":g.name,
            "Tipo":"Invitado",
            "Categoría":"Invitado",
            "Asistencia":"Presente",
            "Decisión invitado":guestStatusLabel(g.status),
            "Anfitrión":"",
            "Compartir":""
          });
        });
      });

      if(window.ExcelJS){
        const wb=new ExcelJS.Workbook(); wb.creator="Seguimiento de Grupo de Oración"; wb.created=new Date();
        const makeSheet=(name,rows,title,percentColumns=[])=>{
          const ws=wb.addWorksheet(name); ws.views=[{state:"frozen",ySplit:2}];
          const headers=rows.length?Object.keys(rows[0]):[];
          ws.mergeCells(1,1,1,Math.max(headers.length,1)); const t=ws.getCell(1,1); t.value=title; t.font={bold:true,size:16,color:{argb:"FFFFFFFF"}}; t.fill={type:"pattern",pattern:"solid",fgColor:{argb:REPORT_COLORS.navy}}; t.alignment={vertical:"middle"}; ws.getRow(1).height=26;
          if(headers.length){ ws.getRow(2).values=headers; ws.getRow(2).eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:REPORT_COLORS.red}};c.alignment={vertical:"middle",wrapText:true};}); }
          rows.forEach((r,idx)=>{const vals=headers.map(h=>r[h]??"");ws.addRow(vals);if(idx%2===1)ws.getRow(idx+3).eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF4F6FA"}});});
          percentColumns.forEach(h=>{const col=headers.indexOf(h)+1;if(col>0)for(let r=3;r<=rows.length+2;r++)ws.getCell(r,col).numFmt="0%";});
          ws.autoFilter={from:{row:2,column:1},to:{row:Math.max(2,rows.length+2),column:Math.max(1,headers.length)}};
          headers.forEach((h,i)=>{let max=h.length;rows.slice(0,100).forEach(r=>{max=Math.max(max,String(r[h]??"").length)});ws.getColumn(i+1).width=Math.min(Math.max(max+2,12),36);});
          return ws;
        };
        makeSheet("Participación",participation,"Participación y funciones en reuniones — "+(grupo?grupo.name:"Grupo"));
        makeSheet("Personas",persons,"Miembros oficiales — "+(grupo?grupo.name:"Grupo"));
        const guestsRows=guestsForReport.length?guestsForReport.map(g=>({"Invitado":g.name,"Estado":guestStatusLabel(g.status),"Primera visita":g.firstMeetingDate||"","Última visita":g.lastMeetingDate||""})):[];
        makeSheet("Invitados",guestsRows,"Invitados — "+(grupo?grupo.name:"Grupo"));

        // Hoja "Asistencia por fecha": primero la matriz persona x fecha y debajo el resumen.
        const ws4=wb.addWorksheet("Asistencia por fecha");
        ws4.views=[{state:"frozen",xSplit:1,ySplit:3}];

        const matrixTitle="Control de asistencia por persona y fecha — "+(grupo?grupo.name:"Grupo");
        const matrixHeaders=["Persona",...attendanceMatrixDates];
        ws4.mergeCells(1,1,1,Math.max(matrixHeaders.length,1));
        const mt=ws4.getCell(1,1); mt.value=matrixTitle; mt.font={bold:true,size:16,color:{argb:"FFFFFFFF"}}; mt.fill={type:"pattern",pattern:"solid",fgColor:{argb:REPORT_COLORS.navy}}; mt.alignment={vertical:"middle"}; ws4.getRow(1).height=26;
        ws4.getRow(2).values=matrixHeaders;
        ws4.getRow(2).eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:REPORT_COLORS.red}};c.alignment={vertical:"middle",horizontal:"center",wrapText:true};});
        attendanceMatrixPeople.forEach((r,idx)=>{
          ws4.addRow(matrixHeaders.map(h=>r[h]??""));
          const row=ws4.getRow(idx+3);
          if(idx%2===1) row.eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF4F6FA"}});
          for(let c=2;c<=matrixHeaders.length;c++) row.getCell(c).alignment={horizontal:"center",vertical:"middle"};
        });
        ws4.getColumn(1).width=30;
        for(let c=2;c<=matrixHeaders.length;c++) ws4.getColumn(c).width=13;
        const matrixEnd=2+attendanceMatrixPeople.length;
        ws4.autoFilter={from:{row:2,column:1},to:{row:Math.max(2,matrixEnd),column:Math.max(1,matrixHeaders.length)}};

        const summaryStart=matrixEnd+3;
        const summaryTitle="Resumen de asistencia por fecha — "+(grupo?grupo.name:"Grupo");
        const sumHeaders=attendanceSummaryByDate.length?Object.keys(attendanceSummaryByDate[0]):["Fecha","Miembros oficiales","Oficiales presentes","Oficiales ausentes","Invitados","Participantes totales","Participantes presentes","% participación"];
        ws4.mergeCells(summaryStart,1,summaryStart,Math.max(sumHeaders.length,1));
        const st=ws4.getCell(summaryStart,1); st.value=summaryTitle; st.font={bold:true,size:15,color:{argb:"FFFFFFFF"}}; st.fill={type:"pattern",pattern:"solid",fgColor:{argb:REPORT_COLORS.navy}}; st.alignment={vertical:"middle"}; ws4.getRow(summaryStart).height=24;
        const sumHeaderRow=summaryStart+1;
        ws4.getRow(sumHeaderRow).values=sumHeaders;
        ws4.getRow(sumHeaderRow).eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:REPORT_COLORS.red}};c.alignment={vertical:"middle",horizontal:"center",wrapText:true};});
        attendanceSummaryByDate.forEach((r,idx)=>{
          ws4.addRow(sumHeaders.map(h=>r[h]??""));
          const row=ws4.getRow(sumHeaderRow+1+idx);
          if(idx%2===1) row.eachCell(c=>c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF4F6FA"}});
        });
        const pctCol=sumHeaders.indexOf("% participación")+1;
        if(pctCol>0) for(let r=sumHeaderRow+1;r<=sumHeaderRow+attendanceSummaryByDate.length;r++) ws4.getCell(r,pctCol).numFmt="0%";
        const summaryEnd=sumHeaderRow+Math.max(1,attendanceSummaryByDate.length);
        ws4.autoFilter={from:{row:sumHeaderRow,column:1},to:{row:summaryEnd,column:Math.max(1,sumHeaders.length)}};
        sumHeaders.forEach((h,i)=>{let max=h.length;attendanceSummaryByDate.slice(0,100).forEach(r=>max=Math.max(max,String(r[h]??"").length));ws4.getColumn(i+1).width=Math.max(ws4.getColumn(i+1).width||0,Math.min(Math.max(max+2,14),28));});

        const buf=await wb.xlsx.writeBuffer(); const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        const result=await downloadsCap.save({filename:"Informe_Personas_"+(grupo?grupo.name:"grupo").replace(/\s+/g,"_")+".xlsx",data:blob});
        setStatus(result.status === "download_started" ? "Descarga iniciada. Revisa la carpeta Descargas." : result.status === "saved" ? "Informe de personas y asistencia exportado a Excel." : "Archivo enviado para compartir.");
      } else {
        const wb=XLSX.utils.book_new();
        const ws1=XLSX.utils.json_to_sheet(participation); const ws2=XLSX.utils.json_to_sheet(persons); const ws3=XLSX.utils.json_to_sheet(guestsForReport.map(g=>({"Invitado":g.name,"Estado":guestStatusLabel(g.status),"Primera visita":g.firstMeetingDate||"","Última visita":g.lastMeetingDate||""})));
        const ws4=XLSX.utils.aoa_to_sheet([]);
        const matrixHeaders=["Persona",...attendanceMatrixDates];
        XLSX.utils.sheet_add_aoa(ws4,[["Control de asistencia por persona y fecha — "+(grupo?grupo.name:"Grupo")]],{origin:"A1"});
        XLSX.utils.sheet_add_aoa(ws4,[matrixHeaders],{origin:"A2"});
        XLSX.utils.sheet_add_json(ws4,attendanceMatrixPeople.map(r=>{const o={};matrixHeaders.forEach(h=>o[h]=r[h]??"");return o;}),{origin:"A3",skipHeader:true});
        const matrixEnd=2+attendanceMatrixPeople.length;
        const summaryStart=matrixEnd+3;
        XLSX.utils.sheet_add_aoa(ws4,[["Resumen de asistencia por fecha — "+(grupo?grupo.name:"Grupo")]],{origin:`A${summaryStart}`});
        const sumHeaders=Object.keys(attendanceSummaryByDate[0]||{"Fecha":""});
        XLSX.utils.sheet_add_aoa(ws4,[sumHeaders],{origin:`A${summaryStart+1}`});
        XLSX.utils.sheet_add_json(ws4,attendanceSummaryByDate,{origin:`A${summaryStart+2}`,skipHeader:true});
        XLSX.utils.book_append_sheet(wb,ws1,"Participación"); XLSX.utils.book_append_sheet(wb,ws2,"Personas"); XLSX.utils.book_append_sheet(wb,ws3,"Invitados"); XLSX.utils.book_append_sheet(wb,ws4,"Asistencia por fecha");
        const data=XLSX.write(wb,{bookType:"xlsx",type:"array"}); const blob=new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        const result=await downloadsCap.save({filename:"Informe_Personas_"+(grupo?grupo.name:"grupo").replace(/\s+/g,"_")+".xlsx",data:blob}); setStatus(result.status === "download_started" ? "Descarga iniciada. Revisa la carpeta Descargas." : "Informe exportado a Excel.");
      }
    }catch(e){setStatus("No se pudo generar el Excel ("+(e.code||"error")+").");}
  }

  function inRange(dateStr, from, to){
    if (!dateStr) return false;
    if (from && dateStr < from) return false;
    if (to && dateStr > to) return false;
    return true;
  }

  const REPORT_COLORS={navy:"0A2A63",blue:"174B9B",red:"D2262E",yellow:"FFD21A",light:"F4F6FA",border:"D9E0EB",text:"17233D",muted:"657086",green:"23784C"};
  function reportParagraph(text,{bold=false,size=22,color=REPORT_COLORS.text,spacingBefore=0,spacingAfter=80}={}){
    return new docx.Paragraph({children:[new docx.TextRun({text:String(text==null?"":text),bold,color,size})],spacing:{before:spacingBefore,after:spacingAfter}});
  }
  function reportCell(text,{header=false,width}={}){
    return new docx.TableCell({width:width?{size:width,type:docx.WidthType.PERCENTAGE}:undefined,shading:header?{fill:REPORT_COLORS.navy}:undefined,children:[new docx.Paragraph({children:[new docx.TextRun({text:String(text==null?"":text),bold:true,color:header?"FFFFFF":REPORT_COLORS.text,size:20})],spacing:{after:30}})]});
  }
  function reportSectionTitle(text){ return new docx.Paragraph({children:[new docx.TextRun({text:String(text),bold:true,color:REPORT_COLORS.navy,size:26})],spacing:{before:260,after:100},border:{bottom:{color:REPORT_COLORS.red,size:10,space:3,style:docx.BorderStyle.SINGLE}}}); }
  function reportDoc(children){
    return new docx.Document({sections:[{properties:{page:{margin:{top:720,right:720,bottom:720,left:720}}},children:[
      new docx.Paragraph({children:[new docx.TextRun({text:"SEGUIMIENTO DE GRUPO DE ORACIÓN",bold:true,color:REPORT_COLORS.navy,size:18})],spacing:{after:80}}),
      ...children,
      new docx.Paragraph({text:"",spacing:{before:100}}),
      new docx.Paragraph({children:[new docx.TextRun({text:"Informe generado por Seguimiento de Grupo de Oración",color:REPORT_COLORS.muted,size:16,italics:true})],alignment:docx.AlignmentType.CENTER})
    ]}]});
  }

  async function generateReport(personId, includeAtt, from, to){
    if (!downloadsCap){ setStatus("La descarga de archivos no está disponible en esta vista."); return; }
    setStatus("Generando informe…");
    try {
      const grupo = groups.find(g => g.id === currentGroupId);
      const activos = people.filter(p => p.active !== false);
      const targets = personId ? activos.filter(p => p.id === personId) : activos;
      const isRange = !!(from || to);

      const children = [];
      children.push(new docx.Paragraph({children:[new docx.TextRun({text:"Informe de Seguimiento",bold:true,color:REPORT_COLORS.red,size:34})],spacing:{after:70}}));
      children.push(reportParagraph(grupo ? grupo.name : "Grupo de Oración",{bold:true,size:25,color:REPORT_COLORS.navy,spacingAfter:70}));
      const rangeLabel = isRange ? ("Rango: " + (from || "inicio") + " a " + (to || "hoy")) : "Informe general — todo el historial";
      children.push(reportParagraph(rangeLabel,{size:18,color:REPORT_COLORS.muted,spacingAfter:40}));
      children.push(reportParagraph("Generado el " + new Date().toLocaleDateString("es"),{size:17,color:REPORT_COLORS.muted,spacingAfter:160}));

      for (const p of targets){
        const snap = await db.collection("groups/" + currentGroupId + "/people/" + p.id + "/situations").orderBy("createdAt","desc").get();
        let allSits = snap.docs.map(d => d.data());

        // Notes filtered by range for display purposes
        const withFilteredNotes = allSits.map(s => {
          const notes = (s.notes || []).slice().sort((a,b) => (a.date < b.date ? 1 : -1));
          const filteredNotes = isRange ? notes.filter(n => inRange(n.date, from, to)) : notes;
          return Object.assign({}, s, { _notes: filteredNotes, _allNotes: notes, _startInRange: inRange(s.startDate, from, to) });
        });

        // "Importante" situations always appear in full, regardless of date range.
        const importantSits = withFilteredNotes.filter(s => s.category === "importante")
          .map(s => Object.assign({}, s, { _notes: s._allNotes }));
        // "Otra" situations follow the normal date-range filtering.
        const otherSits = withFilteredNotes.filter(s => s.category !== "importante")
          .filter(s => !isRange || s._startInRange || s._notes.length > 0);

        children.push(reportSectionTitle(p.name));

        const civilLine = p.married
          ? "Estado civil: Casado(a)" + (p.spouseName ? " con " + p.spouseName : "") + (p.marriageYears != null && p.marriageYears !== "" ? " — " + p.marriageYears + (Number(p.marriageYears)===1?" año":" años") + " de casados" : "")
          : "Estado civil: Soltero(a)";
        const childrenLine = p.hasChildren
          ? "Hijos: " + (p.childrenCount != null && p.childrenCount !== "" ? p.childrenCount : "Sí")
          : "Hijos: No";
        const groupTimeLine = p.joinDate
          ? "En el grupo desde: " + p.joinDate + (timeSince(p.joinDate) ? " (" + timeSince(p.joinDate) + ")" : "")
          : null;
        children.push(new docx.Paragraph({ text: civilLine }));
        children.push(new docx.Paragraph({ text: childrenLine }));
        if (p.phone) children.push(new docx.Paragraph({ text: "Celular: " + p.phone }));
        if (p.birthday) children.push(new docx.Paragraph({ text: "Cumpleaños: " + formatBirthdayShort(p.birthday) }));
        if (p.memberType) children.push(new docx.Paragraph({ text: "Tipo: " + p.memberType }));
        if (p.sex) children.push(new docx.Paragraph({ text: "Sexo: " + p.sex }));
        if (p.unionFree) children.push(new docx.Paragraph({ text: "Unión libre: " + (p.partnerName || "sin nombre") + " — desde " + (p.unionFrom || "—") + " — " + (p.unionCurrent ? "Actualidad" : (p.unionTo || "—")) }));
        if (groupTimeLine) children.push(new docx.Paragraph({ text: groupTimeLine, spacing: { after: 100 } }));

        function pushSituation(s){
          children.push(new docx.Paragraph({
            children: [
              new docx.TextRun({ text: s.description, bold: true }),
              new docx.TextRun({ text: "  [" + (s.status === "superada" ? "Superada" : "En proceso") + "]", italics: true })
            ],
            spacing: { before: 150 }
          }));
          children.push(new docx.Paragraph({ text: "Desde: " + (s.startDate || "—") }));
          if (s._notes.length){
            s._notes.forEach(n => {
              children.push(new docx.Paragraph({ text: "• " + n.date + " — " + n.text }));
            });
          } else {
            children.push(new docx.Paragraph({ text: isRange ? "Sin anotaciones en este rango." : "Sin anotaciones semanales todavía.", italics: true }));
          }
        }

        children.push(new docx.Paragraph({ text: "Temas importantes", heading: docx.HeadingLevel.HEADING_3, spacing: { before: 200 } }));
        if (!importantSits.length){
          children.push(new docx.Paragraph({ text: "Sin temas importantes registrados.", italics: true }));
        } else {
          importantSits.forEach(pushSituation);
        }

        children.push(new docx.Paragraph({ text: "Otras luchas o situaciones", heading: docx.HeadingLevel.HEADING_3, spacing: { before: 200 } }));
        if (!otherSits.length){
          children.push(new docx.Paragraph({ text: isRange ? "Sin actividad registrada en este rango de fechas." : "Sin otras situaciones registradas.", italics: true }));
        } else {
          otherSits.forEach(pushSituation);
        }
      }

      if (includeAtt){
        children.push(reportSectionTitle("Resumen de asistencia"));
        const attSnap = await db.collection("groups/" + currentGroupId + "/attendance").orderBy("date","desc").limit(500).get();
        let attDocs = attSnap.docs.map(d => d.data());
        if (isRange) attDocs = attDocs.filter(a => inRange(a.date, from, to));
        if (!attDocs.length){
          children.push(new docx.Paragraph({ text: "Sin registros de asistencia" + (isRange ? " en este rango." : ".") }));
        } else {
          const rows = [ new docx.TableRow({ children: [
            reportCell("Persona",{header:true}), reportCell("Reuniones",{header:true}), reportCell("Asistencias",{header:true}), reportCell("% Asistencia",{header:true})
          ]})];
          for (const p of targets){
            let total = 0, presentes = 0;
            attDocs.forEach(a => {
              if (a.present && Object.prototype.hasOwnProperty.call(a.present, p.id)){
                total++;
                if (a.present[p.id]) presentes++;
              }
            });
            const pct = total ? Math.round((presentes/total)*100) + "%" : "—";
            rows.push(new docx.TableRow({ children: [
              reportCell(p.name), reportCell(String(total)), reportCell(String(presentes)), reportCell(pct)
            ]}));
          }
          children.push(new docx.Table({ rows, width: { size: 100, type: docx.WidthType.PERCENTAGE } }));
        }
      }

      const doc = reportDoc(children);
      const blob = await docx.Packer.toBlob(doc);
      const scopeLabel = personId ? (activos.find(p=>p.id===personId)||{}).name : "Grupo";
      const rangeTag = isRange ? ("_" + (from||"inicio") + "_a_" + (to||"hoy")) : "_general";
      const filename = "Informe_" + (grupo ? grupo.name : "grupo") + "_" + (scopeLabel||"") + rangeTag + ".docx";
      const result = await downloadsCap.save({ filename: filename.replace(/\s+/g,"_"), data: blob });
      setStatus(result.status === "download_started" ? "Descarga iniciada. Revisa la carpeta Descargas." : result.status === "saved" ? "Informe descargado." : "Archivo enviado para compartir.");
    } catch(e){
      setStatus("No se pudo generar el informe" + (e && e.code ? " (" + e.code + ")" : "") + ".");
    }
  }

  function cell(text, header){
    return new docx.TableCell({
      children: [ new docx.Paragraph({ children: [ new docx.TextRun({ text: text, bold: !!header }) ] }) ]
    });
  }

  async function generateMeetingsReport(from, to){
    if (!downloadsCap){ setStatus("La descarga de archivos no está disponible en esta vista."); return; }
    setStatus("Generando informe de reuniones…");
    try {
      const grupo = groups.find(g => g.id === currentGroupId);
      const isRange = !!(from || to);
      const meetSnap = await db.collection("groups/" + currentGroupId + "/meetings").orderBy("date","desc").limit(500).get();
      let meetings = meetSnap.docs.map(d => ({id:d.id, ...d.data()})).filter(m => !isRange || inRange(m.date, from, to));
      const attSnap = await db.collection("groups/" + currentGroupId + "/attendance").orderBy("date","desc").limit(500).get();
      const attMap = {}; attSnap.docs.forEach(d=>{const a=d.data();attMap[a.date]=a||{};});
      const activos = people.filter(p => p.active !== false);
      const children=[];
      children.push(new docx.Paragraph({children:[new docx.TextRun({text:"Informe de Reuniones",bold:true,color:REPORT_COLORS.red,size:34})],spacing:{after:70}}));
      children.push(reportParagraph(grupo ? grupo.name : "Grupo de Oración",{bold:true,size:25,color:REPORT_COLORS.navy,spacingAfter:70}));
      children.push(reportParagraph(isRange ? ("Rango: "+(from||"inicio")+" a "+(to||"hoy")) : "Todo el historial de reuniones",{size:18,color:REPORT_COLORS.muted,spacingAfter:40}));
      children.push(reportParagraph("Generado el "+new Date().toLocaleDateString("es"),{size:17,color:REPORT_COLORS.muted,spacingAfter:160}));
      if(!meetings.length) children.push(reportParagraph(isRange?"Sin reuniones registradas en este rango de fechas.":"Sin reuniones registradas todavía.",{size:19,color:REPORT_COLORS.muted}));
      for(const m of meetings){
        const presentMap=(attMap[m.date]||{}).present||{};
        const attendees=activos.filter(p=>presentMap[p.id]===true);
        const absents=activos.filter(p=>presentMap[p.id]!==true);
        const host=activos.find(p=>p.id===m.hostId);
        const share=activos.find(p=>p.id===m.shareId);
        const guests=legacyGuestsFromMeeting(m);
        const guestCount=guests.length;
        const totalParticipants=activos.length+guestCount;
        const participantCount=attendees.length+guestCount;
        const pct=totalParticipants?Math.round(participantCount/totalParticipants*100):0;
        children.push(reportSectionTitle(m.date));
        const summaryRows=[new docx.TableRow({children:[reportCell("Dato",{header:true}),reportCell("Detalle",{header:true})]})];
        summaryRows.push(new docx.TableRow({children:[reportCell("Miembros oficiales"),reportCell(String(activos.length))]}));
        summaryRows.push(new docx.TableRow({children:[reportCell("Asistencia oficial"),reportCell(String(attendees.length)+" / "+activos.length)]}));
        summaryRows.push(new docx.TableRow({children:[reportCell("Invitados"),reportCell(String(guestCount))]}));
        summaryRows.push(new docx.TableRow({children:[reportCell("Participación total"),reportCell(String(participantCount)+" / "+String(totalParticipants)+" · "+pct+"%")] }));
        summaryRows.push(new docx.TableRow({children:[reportCell("Anfitrión"),reportCell(host?host.name:"—")]}));
        summaryRows.push(new docx.TableRow({children:[reportCell("Compartir"),reportCell(m.shareId==="__DE_TRAJE__"?"De traje":(share?share.name:"—"))]}));
        children.push(new docx.Table({rows:summaryRows,width:{size:100,type:docx.WidthType.PERCENTAGE}}));
        children.push(reportSectionTitle("Invitados"));
        if(guests.length){
          const guestRows=[new docx.TableRow({children:[reportCell("Nombre",{header:true}),reportCell("Estado",{header:true})]})];
          guests.forEach(g=>guestRows.push(new docx.TableRow({children:[reportCell(g.name),reportCell(guestStatusLabel(g.status))]})));
          children.push(new docx.Table({rows:guestRows,width:{size:100,type:docx.WidthType.PERCENTAGE}}));
        } else children.push(reportParagraph("No hubo invitados registrados.",{size:18,color:REPORT_COLORS.muted}));
        children.push(reportSectionTitle("Miembros que no asistieron"));
        if(absents.length) absents.forEach(p=>children.push(reportParagraph("• "+p.name,{size:18,spacingAfter:35}))); else children.push(reportParagraph("Todos los miembros oficiales asistieron.",{size:18,color:REPORT_COLORS.green}));
        children.push(reportSectionTitle("Temas, asuntos y observaciones"));
        (m.notes||"").split("\n").forEach(line=>children.push(reportParagraph(line||" ",{size:18,spacingAfter:45})));
      }
      const doc=reportDoc(children); const blob=await docx.Packer.toBlob(doc);
      const rangeTag=isRange?("_"+(from||"inicio")+"_a_"+(to||"hoy")):"_general";
      const filename="Informe_Reuniones_"+(grupo?grupo.name:"grupo")+rangeTag+".docx";
      const result=await downloadsCap.save({filename:filename.replace(/\s+/g,"_"),data:blob});
      setStatus(result.status === "download_started" ? "Descarga iniciada. Revisa la carpeta Descargas." : result.status === "saved" ? "Informe de reuniones descargado." : "Archivo enviado para compartir.");
    } catch(e){ setStatus("No se pudo generar el informe" + (e && e.code ? " (" + e.code + ")" : "") + "."); }
  }

  init();
})();
</script>
